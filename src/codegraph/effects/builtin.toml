# Built-in effect catalog: dotted-name glob patterns to side-effect kinds.
#
# Loaded by `codegraph.effects.catalog.Catalog.load` and merged with a
# project's `codegraph.toml` [[effect]] overrides. See catalog.py for the
# matching rule (longest literal prefix wins, overrides break ties).
#
# GLOBAL_MUTATE has no entries here by design: it is detected syntactically
# (assignment to a module/class-level name), not by a call-site catalog.

[[effect]]
match = "requests.*"
kind = "NETWORK"

[[effect]]
match = "httpx.*"
kind = "NETWORK"

[[effect]]
match = "urllib.request.*"
kind = "NETWORK"

[[effect]]
match = "socket.*"
kind = "NETWORK"

[[effect]]
match = "subprocess.*"
kind = "PROCESS"

[[effect]]
match = "os.system"
kind = "PROCESS"

[[effect]]
match = "os.exec*"
kind = "PROCESS"

[[effect]]
match = "os.environ*"
kind = "ENV_READ"

[[effect]]
match = "os.getenv"
kind = "ENV_READ"

[[effect]]
match = "open"
kind = "FS_READ"

[[effect]]
match = "pathlib.Path.read*"
kind = "FS_READ"

[[effect]]
match = "pathlib.Path.write*"
kind = "FS_WRITE"

[[effect]]
match = "shutil.*"
kind = "FS_WRITE"

[[effect]]
match = "*.session.commit"
kind = "DB_WRITE"

[[effect]]
match = "*.session.add"
kind = "DB_WRITE"

[[effect]]
match = "*.execute"
kind = "DB_WRITE"

[[effect]]
match = "psycopg*"
kind = "DB_READ"

[[effect]]
match = "boto3.*"
kind = "DB_WRITE"

[[effect]]
match = "random.*"
kind = "NONDETERMINISM"

[[effect]]
match = "time.time"
kind = "NONDETERMINISM"

[[effect]]
match = "uuid.uuid4"
kind = "NONDETERMINISM"

[[effect]]
match = "datetime.datetime.now"
kind = "NONDETERMINISM"
